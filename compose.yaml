name: smartnet

x-php: &php
  build: .
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - ./.env.docker:/var/www/html/.env
  environment:
    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-smartnet}
    DB_USERNAME: ${DB_USERNAME:-smartnet}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
  init: true

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-smartnet}
      MARIADB_USER: ${DB_USERNAME:-smartnet}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  bootstrap:
    <<: *php
    command: smartnet-bootstrap
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *php
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-interaction"]
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 15s

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90", "--no-interaction"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 120s

  vite:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_USE_POLLING: "1"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      - ./.env.docker:/var/www/html/.env:ro
    command: ["sh", "-c", "rm -f public/hot && npm install --no-package-lock --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  mariadb_data:
  vendor:
  node_modules:
